name: Importa sito da Vercel
on:
  push:
    paths: ['.github/workflows/import-sito.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica il sito online
        run: |
          set -e
          BASE=https://livingstays.vercel.app
          mkdir -p site && cd site
          wget -q --mirror --page-requisites --no-host-directories -e robots=off "$BASE/" || true
          for f in favicon.png img/lion.png img/logo-experiences.png img/logo-stays.png img/mark.png \
            img/h0.webp img/h1.webp img/h2.webp img/h3.webp img/h4.webp img/h5.webp img/h6.webp img/h7.webp \
            img/p/kleos-1.webp img/p/kleos-2.webp img/p/kleos-3.webp img/p/kleos-4.webp img/p/kleos-5.webp \
            img/p/pantano-1.webp img/p/pantano-2.webp img/p/pantano-3.webp img/p/pantano-4.webp img/p/pantano-5.webp \
            img/p/suite-1.webp img/p/suite-2.webp img/p/suite-3.webp \
            img/p/villa-1.webp img/p/villa-2.webp img/p/villa-3.webp img/p/villa-4.webp img/p/villa-5.webp \
            img/x/x-cave.webp img/x/x-crater.webp img/x/x-ebike.webp img/x/x-lava.webp img/x/x-snow.webp \
            robots.txt sitemap.xml; do
            mkdir -p "$(dirname "$f")"; curl -sfL "$BASE/$f" -o "$f" || rm -f "$f"
          done
          grep -oE 'href="/[^"#?]*"' index.html 2>/dev/null | cut -d'"' -f2 | sort -u | while read p; do
            [ "$p" = "/" ] && continue
            wget -q --page-requisites --no-host-directories -e robots=off "$BASE$p" || true
          done
          find . -type f | sort
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/import-sito.yml
          git add site
          git commit -m "Importa il sito attuale da Vercel nella cartella site/"
          git push
